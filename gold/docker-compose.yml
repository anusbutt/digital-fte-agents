services:
  odoo:
    image: odoo:17.0
    container_name: gold-odoo
    restart: unless-stopped
    ports:
      - "8069:8069"
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - odoo-config:/etc/odoo
    networks:
      - odoo-net

  db:
    image: postgres:15
    container_name: gold-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - odoo-net

volumes:
  odoo-data:
  odoo-config:
  postgres-data:

networks:
  odoo-net:
    driver: bridge
